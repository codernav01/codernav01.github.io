name: Update latest Medium article

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-latest-medium
  cancel-in-progress: false

jobs:
  update-latest-article:
    runs-on: ubuntu-latest
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v4

      - name: Fetch and select newest non-featured Medium story
        run: |
          python3 - <<'PY'
          import html
          import json
          import re
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime
          from email.utils import parsedate_to_datetime
          from pathlib import Path

          feed_url = "https://medium.com/feed/@codecosmosbynav"
          pinned = {
              "https://medium.com/@codecosmosbynav/whatsapp-bug-removes-python-underscores-how-a-hidden-formatting-issue-breaks-your-code-e352fdceda61",
              "https://medium.com/@codecosmosbynav/10-pandas-tricks-that-saved-my-data-analyst-job-0fe0620d421f",
          }
          request = urllib.request.Request(
              feed_url,
              headers={"User-Agent": "Mozilla/5.0 (compatible; PortfolioFeedBot/1.0)"}
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              xml_data = response.read()

          root = ET.fromstring(xml_data)
          channel = root.find("channel")
          if channel is None:
              raise RuntimeError("Medium RSS feed has no channel")
          items = channel.findall("item")
          if not items:
              raise RuntimeError("Medium RSS feed contains no stories")

          def child_text(node, path):
              found = node.find(path)
              return (found.text or "").strip() if found is not None else ""

          def clean_description(value):
              value = re.sub(r"(?is)<(script|style).*?>.*?</\1>", " ", value)
              value = re.sub(r"(?s)<[^>]+>", " ", value)
              value = html.unescape(re.sub(r"\s+", " ", value)).strip()
              return value[:190].rsplit(" ", 1)[0] + "…" if len(value) > 190 else value

          def thumbnail_for(item):
              for path in ("{http://search.yahoo.com/mrss/}thumbnail", "enclosure"):
                  node = item.find(path)
                  if node is not None:
                      url = node.get("url")
                      if url and url.startswith("https://"):
                          return url
              # Medium often embeds the lead image in content:encoded.
              content = item.find("{http://purl.org/rss/1.0/modules/content/}encoded")
              if content is not None and content.text:
                  match = re.search(r"<img[^>]+src=['""]([^'""]+)['""]", content.text, re.I)
                  if match and match.group(1).startswith("https://"):
                      return html.unescape(match.group(1))
              return ""

          stories = []
          for item in items:
              link = child_text(item, "link").split("?")[0].rstrip("/")
              if not link or link in pinned:
                  continue
              date_text = child_text(item, "pubDate")
              try:
                  published = parsedate_to_datetime(date_text)
                  if published.tzinfo is None:
                      published = published.replace(tzinfo=datetime.now().astimezone().tzinfo)
              except (TypeError, ValueError, OverflowError):
                  published = datetime.min.astimezone()
              title = html.unescape(child_text(item, "title"))
              if not title or not link.startswith("https://medium.com/"):
                  continue
              desc = child_text(item, "description")
              if not desc:
                  content = item.find("{http://purl.org/rss/1.0/modules/content/}encoded")
                  desc = content.text if content is not None and content.text else ""
              stories.append({
                  "title": title,
                  "link": link,
                  "pubDate": date_text,
                  "_published": published,
                  "description": clean_description(desc) or "Read the latest article on Code Cosmos by Nav.",
                  "thumbnail": thumbnail_for(item),
              })

          if not stories:
              raise RuntimeError("No non-featured Medium stories found in RSS; retaining previous data")

          stories.sort(key=lambda story: story["_published"], reverse=True)
          latest = stories[0]
          latest.pop("_published")
          output = Path("latest-medium.json")
          new_content = json.dumps(latest, ensure_ascii=False, indent=2) + "\n"
          if output.exists() and output.read_text(encoding="utf-8") == new_content:
              print("Latest non-featured Medium story is unchanged:", latest["title"])
          else:
              output.write_text(new_content, encoding="utf-8")
              print("Selected latest non-featured Medium story:", latest["title"])
          PY

      - name: Commit changed feed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest-medium.json
          if git diff --cached --quiet; then
            echo "Latest Medium story has not changed."
            exit 0
          fi
          git commit -m "Refresh latest Medium article"
          git push
